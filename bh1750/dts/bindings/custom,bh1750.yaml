description: My custom BH1750

compatible: "custom,bh1750"

include: [i2c-device.yaml]

properties:
  mode:
    type: int
    required: true
    description: |
      BH1750 operation mode option:
      - 0 : H-Resolution Mode
      - 1 : H-Resolution Mode 2
      - 2 : L-Resolution Mode
    enum:
      - 0
      - 1
      - 2
